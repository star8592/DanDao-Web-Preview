<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>丹道 · 原生高清三语实炼</title><style>body{margin:0;background:#102018;color:#e9e5d2;font:15px/1.6 system-ui,sans-serif}main{max-width:1020px;margin:auto;padding:24px 16px 50px}h1{font:500 32px/1.3 Georgia,serif}h2{font-size:17px}p{color:#bacbbd}section{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}article{padding:14px;border:1px solid #3c5645;border-radius:12px;background:#182a20}video{width:100%;aspect-ratio:9/16;background:#0b1911;display:block;border-radius:7px}a{color:#d4dcae}@media(max-width:680px){section{grid-template-columns:1fr}video{max-width:340px;margin:auto}}</style></head><body><main><p>DanDao · W189 · Native HD</p><h1>一炉一世界 · 原生高清实炼</h1><p>真实本地炼丹实录，RTX 5070 Ti 渲染。原生 1080×1920，无后期尺寸放大或插帧。各片的真实采样帧率见录制证据。繁体版暂用普通话配音。</p><section id="videos"></section><p>此处为制作验收，不是社交平台发布回执。正式游戏的各语言界面及推广落地页仍须完成验收。</p><p><a href="../studio-w188/">上一版三语样片</a> · <a href="https://dandao.playmoru.com/">正式游戏</a></p></main><script>const rows=[["en-US","English"],["zh-CN","简体中文"],["zh-TW","繁體中文"]];for(const [lang,label] of rows){const base="DD-earned-pill-"+lang+"-w189-native";const card=document.createElement("article");card.innerHTML='<h2>'+label+'</h2><video controls playsinline preload="metadata" poster="'+base+'.jpg" src="'+base+'.mp4"></video><p class="detail">核对录制证据</p><a href="'+base+'.mp4">MP4</a> · <a href="'+base+'.srt">字幕</a> · <a href="'+base+'.json">录制证据</a>';document.querySelector("#videos").append(card);fetch(base+".json").then(r=>{if(!r.ok)throw Error("not ready");return r.json()}).then(m=>card.querySelector(".detail").textContent=m.reward+" · "+m.grade+" · "+m.source_sample_fps+" fps").catch(()=>card.querySelector(".detail").textContent="待核验");}</script></body></html>
