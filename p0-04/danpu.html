<title>丹谱 · 丹道</title>

  <link rel="modulepreload" crossorigin href="/DanDao-Web-Preview/p0-04/assets/pill-aura-CuJA8Fm1.js">
  <link rel="stylesheet" crossorigin href="/DanDao-Web-Preview/p0-04/assets/pillAtlas-DfnTOsj3.css">

<body>
<div class="atlas-app">
<header class="atlas-header"><a class="back" href="/DanDao-Web-Preview/p0-04/">‹ 返回丹炉</a><div class="atlas-title"><span>丹 道</span><h1>丹谱 · 观丹</h1></div><small>实物材质图鉴</small></header>
<main class="atlas-main">
<section class="atlas-stage" aria-label="可拖动旋转的立体丹药">
<canvas id="specimen" aria-label="可拖动旋转查看丹药层色、纹路与浮雕" role="img"></canvas>
<p class="stage-caption">拖动旋转 · 观察釉光、内层色泽与立体丹纹</p>
<button id="layer-view" type="button" class="atlas-layer-toggle" aria-pressed="false">透视丹髓</button>
</section>
<section class="atlas-settings">
<div class="eyeline">丹性 · 七类</div>
<div id="nature-choices" class="nature-choices" role="group" aria-label="选择药性"></div>
<div class="eyeline">火候品级</div>
<div id="grade-choices" class="grade-choices" role="group" aria-label="选择丹药品级"></div>
<div class="atlas-property">
<div class="pill-identity"><span id="pill-subtitle">翠脉玉髓</span><h2 id="pill-title">灵藤分脉</h2></div>
<div id="pill-metadata" class="pill-metadata"></div>
<p id="pill-description"></p>
</div>
<button id="another-pattern" class="pattern-switch" type="button">变换丹纹 · 看同药性不同纹理</button>
<p class="atlas-hint">真实三维物理材质演示。同一药性可因投药配伍与火候不同形成不同花纹；正式游戏中的外观由本炉结果决定，并非抽奖。</p>
</section>
</main>
</div>
</body>
